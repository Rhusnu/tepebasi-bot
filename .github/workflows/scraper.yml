name: MEB Kurs Takip Botu

on:
  schedule:
    # Her 15 dakikada bir çalıştır (7/24)
    - cron: '*/15 * * * *'
  # Manuel tetikleme (GitHub üzerinden "Run workflow" butonu ile)
    workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest
    
    steps:
    - name: Depoyu Klonla (Checkout repo)
      uses: actions/checkout@v3

    - name: Python Kurulumu
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Kütüphaneleri Yükle
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Botu Çalıştır
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python bot.py
      
    - name: Yeni Haberi Kaydet (Eğer varsa)
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add last_news.txt
        # Sadece last_news.txt değişmişse commit ve push yap
        git diff --staged --quiet || (git commit -m "Son duyuru güncellendi" && git push)
